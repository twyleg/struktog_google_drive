<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="Struktog ist ein kostenloses Open-Source-Tool zum Erstellen von Struktogrammen für Informatikunterricht und Lehrerbildung.">
    <meta name="robots"
        content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
    <meta name="keywords"
        content="Struktogramm, Nassi-Shneiderman-Diagramm, Informatikunterricht, Lehrerbildung, Open Source, Diagrammeditor, Codegenerierung">
    <meta property="og:title"
        content="Struktog - Struktogramme erstellen und unterrichten">
    <meta property="og:description"
        content="Struktog ist ein kostenloses Open-Source-Tool zum Erstellen von Struktogrammen für Informatikunterricht und Lehrerbildung.">
    <meta property="og:type"
        content="website">
    <meta property="og:url"
        content="<%- site.siteUrl || "./" %>">
    <meta property="og:site_name"
        content="Struktog">
    <meta property="og:locale"
        content="de_DE">
    <meta property="og:image"
        content="<%- site.siteUrl ? site.siteUrl.replace(/\/?$/, "/") + "social-preview.svg" : "./social-preview.svg" %>">
    <meta name="twitter:card"
        content="summary_large_image">
    <meta name="twitter:title"
        content="Struktog - Struktogramme erstellen und unterrichten">
    <meta name="twitter:description"
        content="Struktog ist ein kostenloses Open-Source-Tool zum Erstellen von Struktogrammen für Informatikunterricht und Lehrerbildung.">
    <meta name="twitter:image"
        content="<%- site.siteUrl ? site.siteUrl.replace(/\/?$/, "/") + "social-preview.svg" : "./social-preview.svg" %>">
    <title>
        <%= htmlWebpackPlugin.options.title %>
    </title>
    <link rel="canonical" href="<%- site.siteUrl || "./" %>">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#264040" />

</head>

<body>
</body>

</html>
