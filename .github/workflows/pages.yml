name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs must deploy the default branch too.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # These checks and the static build do not need browser driver binaries.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test privacy controls
        run: npm run test:privacy

      - name: Test Google Drive integration
        run: npm run test:drive

      - name: Test image clipboard
        run: npm run test:clipboard

      - name: Test Google Cloud setup script
        run: python3 -B -m unittest discover -s test -p 'setup_google_drive_test.py'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public site
        run: npm run build:public
        env:
          # Browser configuration is embedded in the public JavaScript bundle.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID || secrets.GOOGLE_APP_ID }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
